type: object
required:
  - _id
  - name
  - email
  - timestamps
properties:
  _id:
    type: string
    description: User id
    example: 6841738d9abba11274e4c270
  name:
    type: string
    description: User name
    example: Nejk dima
  email:
    type: string
    description: Email User
    example: doe@mail.com
  timestamps:
    type: object
    format: date-time
    description: User created
    example: 2025-06-06T17:54:59.164+00:00 2025-06-06T17:54:59.164+00:00