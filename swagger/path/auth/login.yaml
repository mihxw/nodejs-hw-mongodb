tags:
  - Auth
summary: Login user
operationId: loginUser
description: Login user
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - password
          - email
        properties:
          email:
            type: string
            description: User email
            example: doe@mail.com
          password:
            type: string
            description: User password
            example: 1233qwe
responses:
  '200':
    description: User login
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: user login
            data:
              $ref: ../../conponents/schemas/user.yaml
  '401':
    $ref: ../../conponents/responses/401.yaml
  '500':
    $ref: ../../conponents/responses/500.yaml