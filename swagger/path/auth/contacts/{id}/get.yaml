tags:
  - Contacts
summary: Get contact by id
operationId: getContacts
description: Get contact by id
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 6841738d9abba11274e4c270
responses:
  '200':
    description: Get contact by id
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully get contact
            data:
              $ref: ../../../conponents/schemas/contact.yaml

  '401':
    $ref: ../../../conponents/responses/401.yaml

  '404':
    $ref: ../../../conponents/responses/404.yaml

  '500':
    $ref: ../../../conponents/responses/500.yaml